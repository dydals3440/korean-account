# actions/labeler v5 — path/branch based auto-labeling for PRs.

"area: registry":
  - changed-files:
      - any-glob-to-any-file:
          - "src/registry/**"

"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "src/core/**"

"area: adapters":
  - changed-files:
      - any-glob-to-any-file:
          - "src/adapters/**"

"area: types":
  - changed-files:
      - any-glob-to-any-file:
          - "src/types.ts"
          - "src/shared/**"

"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - "tsdown.config.ts"
          - "scripts/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "README.en.md"
          - "DOCS.md"
          - "CONTRIBUTING.md"
          - "CHANGELOG.md"
          - "SECURITY.md"
          - "CODE_OF_CONDUCT.md"

test:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/*.spec.ts"
          - "src/**/*.fixtures.ts"
          - "vitest.config.ts"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "pnpm-lock.yaml"

release:
  - head-branch:
      - "^changeset-release/"
