# Path-based area labels only; type and breaking-change labels come from the PR title.
"area: registry":
  - changed-files:
      - any-glob-to-any-file: ["src/registry/**"]
"area: core":
  - changed-files:
      - any-glob-to-any-file: ["src/core/**"]
"area: adapters":
  - changed-files:
      - any-glob-to-any-file: ["src/adapters/**"]
"area: types":
  - changed-files:
      - any-glob-to-any-file: ["src/types.ts", "src/shared/**", "src/**/*.types.spec.ts"]
"area: build":
  - changed-files:
      - any-glob-to-any-file:
          [
            "*.config.ts",
            ".editorconfig",
            "scripts/**",
            "package.json",
            "pnpm-lock.yaml",
            "pnpm-workspace.yaml",
            ".nvmrc",
            "tsconfig.json",
            ".size-limit.json",
          ]
"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", ".github/dependabot.yml"]
"area: repository":
  - changed-files:
      - any-glob-to-any-file:
          [
            ".github/ISSUE_TEMPLATE/**",
            ".github/PULL_REQUEST_TEMPLATE.md",
            ".github/CODEOWNERS",
            ".github/labeler.yml",
            ".github/labels.json",
            ".github/MAINTAINING.md",
            ".github/release.yml",
          ]
"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          [
            "README.md",
            "README.en.md",
            "DOCS.md",
            "docs/**",
            "CHANGELOG.md",
            "CONTRIBUTING.md",
            "SECURITY.md",
            "CODE_OF_CONDUCT.md",
            "THIRD_PARTY_NOTICES.md",
            ".github/MAINTAINING.md",
          ]
