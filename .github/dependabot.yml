version: 2

# All actions are pinned to commit SHAs. Without Dependabot nobody bumps them
# and security patches never arrive. (`changesets/action@v1` was a
# force-pushable branch, not a tag — hence SHA pin + Dependabot.)
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - "area: ci"
    groups:
      # Group action bumps into one PR (majors included).
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      prefix-development: chore
    labels:
      - dependencies
    groups:
      # Runtime dependencies are zero, so devDeps are everything. One grouped
      # PR, majors included (zod majors are excluded below).
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
    ignore:
      # zod is a peerDependency (`^3.23.0 || ^4.0.0`). The zod-compat CI matrix
      # verifies both majors; auto-bumping the devDep past the peer range would
      # break that contract silently.
      - dependency-name: zod
        update-types:
          - version-update:semver-major
