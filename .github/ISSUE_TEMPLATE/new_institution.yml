name: 기관·패턴 추가
description: 금융기관 또는 계좌 패턴 추가를 요청합니다. CMS PDF 근거가 필요합니다.
title: "feat(registry): "
labels: ["type: feature", "area: registry"]
body:
  - type: markdown
    attributes:
      value: |
        [금융결제원 CMS 자료](https://www.cmsedi.or.kr/cms/board/workdata/cms)의 판본·페이지·표 행을 인용해 주세요.
        PDF 밖의 개별 서비스 패턴은 우선 `detector.extend()`로 보강합니다.
        실제 계좌번호 대신 합성 예제를 사용해 주세요. 기존 데이터의 오류 정정은 버그 신고 양식을 사용합니다.
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 기관명·기관코드와 추가할 패턴을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 변경 및 영향
      description: 자릿수·그루핑·식별자·과목·검증 자리 위치와 기존 패턴에 미치는 영향을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증
      description: PDF 판본·페이지·표 행과 통과/거부해야 할 합성 입력을 적어 주세요.
      placeholder: |
        PDF YYYY.MM.DD, p.N, 표의 기관명·행: …
        허용 입력: …
        거부 입력: …
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 관련 항목
      description: 자료 링크·관련 이슈·PR과 직접 구현 의사가 있으면 적어 주세요.
