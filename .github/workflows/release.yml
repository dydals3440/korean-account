name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a publish midway: a partial npm release cannot be rolled back.
concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  # Runs every check and third-party install without any write credentials.
  verify:
    name: Verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Check distribution
        run: pnpm check:dist

      - name: Check packed consumers
        run: pnpm check:consumer

  # Holds publish rights; only installs the lockfile and runs changesets.
  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC): no stored npm token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm version`/`pnpm publish` are pnpm built-ins, so call changeset explicitly.
      # `prepublishOnly` rebuilds and re-checks dist right before publishing.
      - name: Create release pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm changeset publish
          version-script: pnpm changeset version
          commit-message: "chore(release): 패키지 버전 갱신"
          pr-title: "chore(release): 패키지 버전 갱신"
