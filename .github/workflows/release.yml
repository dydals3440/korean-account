name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포 잡은 cancel-in-progress 를 켜지 않는다 — 중간에 끊기면 npm 에 반쯤 올라간다.
concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusts this repository's release.yml; no stored npm token is needed.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup npm
        run: npm install --global npm@12.1.0

      - name: Report tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Coverage
        run: pnpm test:coverage

      # `prepublishOnly` 도 build 를 돌리지만 여기서도 돌린다. dist 는 gitignore 되어
      # 있어서, 어떤 이유로든 prepublishOnly 가 실행되지 않으면 dist 없는 패키지가
      # npm 에 올라간다. 중복 2초를 지불하고 그 사고를 막는다.
      - name: Build
        run: pnpm build

      - name: Check distribution
        run: pnpm check:dist

      - name: Check packed consumers
        run: pnpm check:consumer

      # `version` / `publish` 에 반드시 `changeset` 을 명시해야 한다. `pnpm version` 은
      # pnpm 내장 명령에 가려져 package.json 의 스크립트가 실행되지 않는다 (88fd0b8).
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm changeset publish
          version-script: pnpm changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
