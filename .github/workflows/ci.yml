name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target other stack branches, and each
  # layer must run CI against its own base.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every main commit keeps its full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No job pushes, so checkout never persists GITHUB_TOKEN.

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest]
        include:
          - node: 24
            os: macos-latest
          - node: 24
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Gated by attw --profile strict + publint.
      - name: Build
        run: pnpm build

      # Tree-shaking regressions surface as byte budgets (.size-limit.json).
      - name: Size limit
        run: pnpm size

      - name: Check package contents
        run: pnpm check:package

      - name: Check packed consumer on Windows
        if: runner.os == 'Windows'
        run: pnpm check:consumer none

  # Builds on .nvmrc, then executes dist on every supported Node, floor included.
  runtime:
    name: Runtime Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node (build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup Node ${{ matrix.node }} (run)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run dist on Node ${{ matrix.node }}
        run: node scripts/check-runtime.mjs

      - name: Run packed adapters on minimum Node
        if: matrix.node == '22.12.0'
        run: node scripts/check-consumer.mjs
        env:
          CONSUMER_RUNTIME_ONLY: "true"

  # Packed tarball + adapter sources against exact peer floors and latest majors.
  # The zero-dependency case proves core and standard-schema need no peers.
  adapter-compat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PEER_INSTALL: ${{ matrix.install }}
      ADAPTER_DIR: ${{ matrix.dir }}
      FORBIDDEN_TYPES: ${{ matrix.forbid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "zod v3 (peer floor)", install: "zod@3.23.0", dir: zod, forbid: "ZodEffects" }
          - { name: "zod v3 latest", install: "zod@^3", dir: zod, forbid: "ZodEffects" }
          - { name: "zod v4 (peer floor)", install: "zod@4.0.0", dir: zod, forbid: "ZodEffects" }
          - { name: "zod v4", install: "zod@^4", dir: zod, forbid: "ZodEffects" }
          - {
              name: "valibot v1 (peer floor)",
              install: "valibot@1.0.0",
              dir: valibot,
              forbid: "SchemaWithPipe|PicklistSchema|CustomSchema",
            }
          - {
              name: "valibot v1",
              install: "valibot@^1",
              dir: valibot,
              forbid: "SchemaWithPipe|PicklistSchema|CustomSchema",
            }
          - {
              name: "yup 1.4 (peer floor)",
              install: "yup@1.4.0",
              dir: yup,
              forbid: "StringSchema|MixedSchema|BooleanSchema|NumberSchema|ObjectSchema",
            }
          - {
              name: "yup v1",
              install: "yup@^1",
              dir: yup,
              forbid: "StringSchema|MixedSchema|BooleanSchema|NumberSchema|ObjectSchema",
            }
          - { name: "arktype v2 (peer floor)", install: "arktype@2.1.0", dir: arktype, forbid: "" }
          - { name: "arktype v2", install: "arktype@^2.1", dir: arktype, forbid: "" }
          - {
              name: "standard-schema (zero-dep)",
              install: "",
              dir: standard-schema,
              forbid: "@standard-schema/spec",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the exact release artifact before swapping consumer peers.
      - name: Build
        run: pnpm build

      - name: Check packed consumer
        run: pnpm check:consumer "${PEER_INSTALL:-none}"

      - name: Install ${{ matrix.install }}
        if: matrix.install != ''
        run: pnpm add -D "$PEER_INSTALL"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test adapter
        run: pnpm vitest run "src/adapters/$ADAPTER_DIR"

      # Public annotations (ZodType<T>, v.GenericSchema<T>, Schema<T>, ...) must
      # keep the declaration surface free of version-pinned validator internals.
      - name: Assert d.ts is version-neutral
        if: matrix.forbid != ''
        run: |
          if grep -Eq "$FORBIDDEN_TYPES" "dist/$ADAPTER_DIR.d.ts" "dist/$ADAPTER_DIR.d.cts"; then
            echo "::error::dist/$ADAPTER_DIR.d.ts leaks version-pinned validator types."
            exit 1
          fi

  consumer-types:
    name: Consumer TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        typescript: ["5.1.6", "5.9.3", "6.0.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:consumer
        env:
          CONSUMER_TYPESCRIPT: ${{ matrix.typescript }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vitest.config.ts thresholds act as a ratchet.
      - name: Test with coverage
        run: pnpm test:coverage
