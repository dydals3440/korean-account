name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target other stack branches, and each
  # layer must run CI against its own base.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Jobs below never push, so checkout must not persist GITHUB_TOKEN in
# .git/config. release.yml keeps credentials because changesets pushes.

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest]
        include:
          - node: 22
            os: macos-latest
          - node: 22
            os: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # `pnpm build` gates on attw (strict) + publint. Without attw, broken
      # type layouts (e.g. missing d.ts chunks) pass publint silently.
      - name: Build
        run: pnpm build

      # Tree-shaking regressions are caught as byte budgets (.size-limit.json).
      - name: Size limit
        run: pnpm size

  # Verifies `engines.node` actually holds by executing dist on the floor version.
  runtime:
    name: Runtime Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node (build)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup Node ${{ matrix.node }} (run)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # Executes dist directly — vitest tests src, so it cannot cover this.
      - name: Run dist on Node ${{ matrix.node }}
        run: node scripts/check-runtime.mjs

  # peerDependencies advertises `zod ^3 || ^4`. Verify what is advertised.
  zod-compat:
    name: zod v${{ matrix.zod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zod: [3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install zod v${{ matrix.zod }}
        run: pnpm add -D zod@^${{ matrix.zod }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Test schema
        run: pnpm vitest run src/adapters/zod

      # Generated d.ts must not be pinned to a zod major. `z.ZodEffects` does
      # not exist in v4.
      - name: Build and assert d.ts is zod-version-neutral
        run: |
          pnpm build
          if grep -q "ZodEffects" dist/zod.d.ts dist/zod.d.cts; then
            echo "::error::dist/schema.d.ts hardcodes zod v3-only types."
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # thresholds in vitest.config.ts act as the ratchet — fails here on drop.
      - name: Test with coverage
        run: pnpm test:coverage
