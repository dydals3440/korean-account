name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target other stack branches, and each
  # layer must run CI against its own base.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Jobs below never push, so checkout must not persist GITHUB_TOKEN in
# .git/config. release.yml keeps credentials because changesets pushes.

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest]
        include:
          - node: 24
            os: macos-latest
          - node: 24
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # `pnpm build` gates on attw (strict) + publint. Without attw, broken
      # type layouts (e.g. missing d.ts chunks) pass publint silently.
      - name: Build
        run: pnpm build

      # Tree-shaking regressions are caught as byte budgets (.size-limit.json).
      - name: Size limit
        run: pnpm size

  # Verifies `engines.node` actually holds by executing dist on the floor version.
  runtime:
    name: Runtime Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node (build)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup Node ${{ matrix.node }} (run)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # Executes dist directly — vitest tests src, so it cannot cover this.
      - name: Run dist on Node ${{ matrix.node }}
        run: node scripts/check-runtime.mjs

  # Test the published tarball and source contracts with exact peer floors and
  # latest supported majors. The none case proves core and standard-schema
  # import/require/types work without installing any validator peers.
  adapter-compat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "zod v3 (peer floor)", install: "zod@3.23.0", dir: zod, forbid: "ZodEffects" }
          - { name: "zod v3 latest", install: "zod@^3", dir: zod, forbid: "ZodEffects" }
          - { name: "zod v4 (peer floor)", install: "zod@4.0.0", dir: zod, forbid: "ZodEffects" }
          - { name: "zod v4", install: "zod@^4", dir: zod, forbid: "ZodEffects" }
          - {
              name: "valibot v1 (peer floor)",
              install: "valibot@1.0.0",
              dir: valibot,
              forbid: "SchemaWithPipe|PicklistSchema|CustomSchema",
            }
          - {
              name: "valibot v1",
              install: "valibot@^1",
              dir: valibot,
              forbid: "SchemaWithPipe|PicklistSchema|CustomSchema",
            }
          - {
              name: "yup 1.4 (peer floor)",
              install: "yup@1.4.0",
              dir: yup,
              forbid: "StringSchema|MixedSchema|BooleanSchema|NumberSchema|ObjectSchema",
            }
          - {
              name: "yup v1",
              install: "yup@^1",
              dir: yup,
              forbid: "StringSchema|MixedSchema|BooleanSchema|NumberSchema|ObjectSchema",
            }
          - { name: "arktype v2 (peer floor)", install: "arktype@2.1.0", dir: arktype, forbid: "" }
          - { name: "arktype v2", install: "arktype@^2.1", dir: arktype, forbid: "" }
          - {
              name: "standard-schema (zero-dep)",
              install: "",
              dir: standard-schema,
              forbid: "@standard-schema/spec",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build exactly the artifact we release, before changing consumer peers.
      - name: Build
        run: pnpm build

      - name: Check packed consumer
        run: pnpm check:consumer "${{ matrix.install || 'none' }}"

      - name: Install ${{ matrix.install }}
        if: matrix.install != ''
        run: pnpm add -D ${{ matrix.install }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Test adapter
        run: pnpm vitest run src/adapters/${{ matrix.dir }}

      # Generated d.ts must not pin the adapter to a validator release —
      # public annotations (ZodType<T>, v.GenericSchema<T>, Schema<T>, ...)
      # keep the declaration surface version-neutral.
      - name: Assert d.ts is version-neutral
        if: matrix.forbid != ''
        run: |
          if grep -Eq "${{ matrix.forbid }}" "dist/${{ matrix.dir }}.d.ts" "dist/${{ matrix.dir }}.d.cts"; then
            echo "::error::dist/${{ matrix.dir }}.d.ts leaks version-pinned internal types."
            exit 1
          fi

  consumer-types:
    name: Consumer TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ["5.9.3", "6.0.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:consumer
        env:
          CONSUMER_TYPESCRIPT: ${{ matrix.typescript }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # thresholds in vitest.config.ts act as the ratchet — fails here on drop.
      - name: Test with coverage
        run: pnpm test:coverage
