name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target other stack branches, and each
  # layer must run CI against its own base.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Jobs below never push, so checkout must not persist GITHUB_TOKEN in
# .git/config. release.yml keeps credentials because changesets pushes.

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest]
        include:
          - node: 22
            os: macos-latest
          - node: 22
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # `pnpm build` gates on attw (strict) + publint. Without attw, broken
      # type layouts (e.g. missing d.ts chunks) pass publint silently.
      - name: Build
        run: pnpm build

      # Tree-shaking regressions are caught as byte budgets (.size-limit.json).
      - name: Size limit
        run: pnpm size

  # Verifies `engines.node` actually holds by executing dist on the floor version.
  runtime:
    name: Runtime Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node (build)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup Node ${{ matrix.node }} (run)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # Executes dist directly — vitest tests src, so it cannot cover this.
      - name: Run dist on Node ${{ matrix.node }}
        run: node scripts/check-runtime.mjs

  # Every validator peer we advertise gets a matrix row proving the adapter
  # works with it; the standard-schema row additionally proves the packed
  # tarball works with NO peers installed at all.
  adapter-compat:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "zod v3 (peer floor)", install: "zod@^3.23.0", dir: zod, forbid: "ZodEffects" }
          - { name: "zod v4", install: "zod@^4", dir: zod, forbid: "ZodEffects" }
          - {
              name: "valibot v1",
              install: "valibot@^1",
              dir: valibot,
              forbid: "SchemaWithPipe|PicklistSchema|CustomSchema",
            }
          - {
              name: "yup 1.4 (peer floor)",
              install: "yup@1.4.0",
              dir: yup,
              forbid: "StringSchema|MixedSchema|BooleanSchema|NumberSchema|ObjectSchema",
            }
          - {
              name: "yup v1",
              install: "yup@^1",
              dir: yup,
              forbid: "StringSchema|MixedSchema|BooleanSchema|NumberSchema|ObjectSchema",
            }
          - { name: "arktype v2", install: "arktype@^2.1", dir: arktype, forbid: "" }
          - {
              name: "standard-schema (zero-dep)",
              install: "",
              dir: standard-schema,
              forbid: "@standard-schema/spec",
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.install }}
        if: matrix.install != ''
        run: pnpm add -D ${{ matrix.install }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Test adapter
        run: pnpm vitest run src/adapters/${{ matrix.dir }}

      - name: Build
        run: pnpm build

      # Generated d.ts must not pin the adapter to a validator release —
      # public annotations (ZodType<T>, v.GenericSchema<T>, Schema<T>, ...)
      # keep the declaration surface version-neutral.
      - name: Assert d.ts is version-neutral
        if: matrix.forbid != ''
        run: |
          if grep -Eq "${{ matrix.forbid }}" "dist/${{ matrix.dir }}.d.ts" "dist/${{ matrix.dir }}.d.cts"; then
            echo "::error::dist/${{ matrix.dir }}.d.ts leaks version-pinned internal types."
            exit 1
          fi

      # The zero-dependency claim, proven against the real artifact: install
      # the packed tarball into a bare project with peers omitted and run it.
      - name: Prove zero-dependency install
        if: matrix.dir == 'standard-schema'
        run: |
          pnpm pack
          mkdir /tmp/std-check && cd /tmp/std-check && npm init -y >/dev/null
          npm i --omit=peer "$GITHUB_WORKSPACE"/korean-account-*.tgz
          node -e '
            import("korean-account/standard-schema").then(({ accountSchema }) => {
              const ok = accountSchema["~standard"].validate("110-436-387740");
              const bad = accountSchema["~standard"].validate("12345");
              if (ok.issues || !bad.issues) process.exit(1);
            });'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # thresholds in vitest.config.ts act as the ratchet — fails here on drop.
      - name: Test with coverage
        run: pnpm test:coverage
