name: PR Title

# Squash merges turn the PR title into the commit subject, so enforce
# Conventional Commits here. Only the event payload is read: no token needed.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9 ,/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR 제목이 Conventional Commits 형식이 아닙니다: '$TITLE'"
            echo "예) fix(core): 분기 규칙이 minScore 컷오프보다 먼저 적용되도록"
            echo "허용 type: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
          echo "OK: $TITLE"
